name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    # The owner's own PC: Ubuntu in WSL with Docker (self-hosted runner
    # "barcodeDesktop-wsl"). GitHub starts nothing on its own machines once
    # the monthly minutes are used up. The PC must be on and logged in.
    runs-on: [self-hosted, Linux, dartchat-pc]
    timeout-minutes: 15
    steps:
      # The PC keeps its files between runs: remove what the last run's
      # server left (owned by root) and the server itself, if still there.
      - name: Clean up after the last run
        run: |
          docker rm -f server >/dev/null 2>&1 || true
          sudo rm -rf "$GITHUB_WORKSPACE/data"

      - uses: actions/checkout@v4

      - name: Check the scripts
        run: |
          sh -n dartchat-server/run.sh
          python3 -m py_compile dartchat-server/*.py tests/*.py

      # Ubuntu's own Python refuses system-wide installs, so the packages go
      # into a virtual environment that the later steps use too.
      - name: Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Unit tests for the group bot
        run: |
          python3 -m pip install -q -r dartchat-server/group_bot/requirements.txt pytest cryptography
          python3 -m pytest -q tests/test_group_bot.py tests/test_group_bot_links.py tests/test_push_gateway.py tests/test_joined_notice.py tests/test_storage_report.py tests/test_moderation.py tests/test_link_fetch.py tests/test_signal_bridge.py tests/test_transcribe.py tests/test_invites.py tests/test_looks.py tests/test_server_stats.py

      - name: Build the add-on image
        run: docker build -t dartchat-server:ci dartchat-server

      - name: Start the server
        run: |
          mkdir data
          cat > data/options.json <<'EOF'
          {"server_name": "chat.test", "registration_token": "",
           "firebase_service_account": "", "resend_api_key": "re_smoke_test",
           "invite_email_from": "", "app_link": "", "max_upload_mb": 20,
           "log_level": "info", "signal_bridge_token": "ci-bridge-password"}
          EOF
          docker run -d --name server --network host \
            -e DARTCHAT_RESEND_BASE=http://127.0.0.1:6190 \
            -e DARTCHAT_MODERATION_MINUTE_MS=1000 \
            -v "$PWD/data:/data" dartchat-server:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:6167/_matrix/client/versions > /dev/null && break
            sleep 2
          done

      - name: Run the smoke test
        run: |
          token="$(docker logs server 2>&1 | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -o 'using the registration token [A-Za-z0-9]*' \
            | awk '{print $5}' | head -n 1)"
          python3 tests/smoke_test.py http://127.0.0.1:6167 "$token"

      - name: Test the group bot in an encrypted group
        run: |
          BRIDGE_TOKEN=ci-bridge-password \
          BOT_RESTART_CMD="docker exec server pkill -f group_bot" \
            timeout 400 python3 tests/bot_e2e.py http://127.0.0.1:6167 \
            boss boss-password-1 lena lena-password-1

      - name: Server log
        if: always()
        run: docker logs server 2>&1 | grep -v memory_serve | tail -80

      - name: Stop the server
        if: always()
        run: |
          docker rm -f server >/dev/null 2>&1 || true
          sudo rm -rf data
